[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ebm21cm"
version = "0.1.0"
description = "Energy-parameterized diffusion models for 21cmFAST x_HI / T_b slices conditioned on matter density"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ebm21cm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
